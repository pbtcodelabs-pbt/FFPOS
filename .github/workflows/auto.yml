# ══════════════════════════════════════════════════════════════════
#  FFPOS (Fast Food POS) — خودکار اَن زِپ + حفاظتی نظام
#  جگہ: ریپو میں  .github/workflows/auto.yml
#
#  1) جو زِپ FF سے شروع ہو اور قاعدے کے مطابق ہو (مثلاً FF610TU001.zip) → خود اَن زِپ
#  2) جس زِپ کا نام FF سے شروع نہ ہو (یا قاعدے کے مطابق نہ ہو) → خود ڈیلیٹ
#  3) زِپ کے اندر سے صرف FFPOS کی اجازت والی فائلیں نکلتی ہیں
#     (index.html، sw.js، manifest.json، icon-192.png، icon-512.png)
#  4) index.html کا APP_VERSION اور sw.js کا CACHE_VERSION زِپ کے نام سے ملنا ضروری ہے
#  5) کامیاب اَن زِپ کے بعد زِپ خود ڈیلیٹ — ریپو صاف رہتا ہے
#  6) آخر میں GitHub Pages کو نیا ورژن پبلش کرنے کا حکم
#
#  زِپ کے نام کا پکا قاعدہ: FF + تاریخ + مہینہ + دن کے دو حروف + تین ہندسوں کا سیریل
#     مثال: FF610TU001.zip = 6 اکتوبر، منگل، سیریل 001  (اگلا: …002، …003)
# ══════════════════════════════════════════════════════════════════
name: FFPOS Auto Unzip & Deploy

on:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - '**.ZIP'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ffpos-auto-unzip
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: ریپو حاصل کریں
        uses: actions/checkout@v4

      - name: زِپ چیک، اَن زِپ اور فالتو زِپ ڈیلیٹ
        shell: python
        run: |
          import os, re, zipfile, subprocess, sys

          ALLOWED = {"index.html", "sw.js", "manifest.json", "icon-192.png", "icon-512.png"}
          REQUIRED = {"index.html"}
          NAME_OK = re.compile(r"^FF(?:[1-9]|[12][0-9]|3[01])(?:[1-9]|1[0-2])(?:MO|TU|WE|TH|FR|SA|SU)[0-9]{3}\.zip$")
          APP_VER_RE = re.compile(r"(?<![A-Za-z0-9_])APP_VERSION\s*=\s*['\"](FF[0-9A-Z]+)['\"]")
          SW_VER_RE  = re.compile(r"CACHE_VERSION\s*=\s*['\"]ffpos-(FF[0-9A-Z]+)['\"]")

          def git(*a):
              subprocess.run(["git", *a], check=True)

          def drop(path, why):
              print(f"❌ ڈیلیٹ ({why}): {path}")
              git("rm", "-q", "-f", path)
              removed.append(os.path.basename(path))

          zips = []
          for root, dirs, files in os.walk("."):
              if ".git" in root.split(os.sep):
                  continue
              for f in files:
                  if f.lower().endswith(".zip"):
                      zips.append(os.path.join(root, f))

          if not zips:
              print("کوئی زِپ نہیں ملی")
              sys.exit(0)

          removed, extracted = [], []
          for path in sorted(zips, key=lambda p: os.path.basename(p)):
              name = os.path.basename(path)
              in_root = os.path.dirname(os.path.normpath(path)) in ("", ".")

              if not name.startswith("FF"):
                  drop(path, "نام FF سے شروع نہیں — یہ FFPOS کی فائل نہیں"); continue
              if not NAME_OK.match(name):
                  drop(path, "نام قاعدے کے مطابق نہیں، مثال FF610TU001.zip"); continue
              if not in_root:
                  drop(path, "زِپ ریپو کے روٹ میں نہیں"); continue

              try:
                  z = zipfile.ZipFile(path)
                  members = [m for m in z.infolist() if not m.is_dir()]
              except zipfile.BadZipFile:
                  drop(path, "خراب زِپ"); continue

              picked = {}
              for m in members:
                  base = os.path.basename(m.filename.replace("\\", "/")).lower()
                  if base in ALLOWED:
                      picked[base] = m
                  else:
                      print(f"   ⚠️ نظرانداز (اجازت نہیں): {m.filename}")

              if not REQUIRED.issubset(picked):
                  z.close(); drop(path, "index.html موجود نہیں"); continue

              ver = name[:-4]

              html = z.read(picked["index.html"]).decode("utf-8", "ignore")
              m = APP_VER_RE.search(html)
              if not m:
                  z.close(); drop(path, "یہ FFPOS کی فائل نہیں — APP_VERSION='FF…' نہیں ملا"); continue
              if m.group(1) != ver:
                  z.close(); drop(path, f"ورژن مختلف: زِپ {ver} مگر index.html میں {m.group(1)}"); continue

              if "sw.js" in picked:
                  sw = z.read(picked["sw.js"]).decode("utf-8", "ignore")
                  s = SW_VER_RE.search(sw)
                  if not s or s.group(1) != ver:
                      found = s.group(1) if s else "نہیں ملا"
                      z.close(); drop(path, f"sw.js کا CACHE_VERSION غلط: چاہیے ffpos-{ver}، ملا {found}"); continue

              for base, info in picked.items():
                  with open(base, "wb") as out:
                      out.write(z.read(info))
                  git("add", base)
                  print(f"   ✅ نکالی: {base}")
              z.close()
              git("rm", "-q", "-f", path)
              extracted.append(name)
              print(f"✅ اَن زِپ مکمل: {name}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FF_DONE={' '.join(extracted) or '-'}\n")
              env.write(f"FF_REMOVED={' '.join(removed) or '-'}\n")

      - name: تبدیلیاں محفوظ (commit + push)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "کوئی تبدیلی نہیں"
            exit 0
          fi
          git commit -m "🤖 FFPOS Auto: unzipped [${FF_DONE}] · removed [${FF_REMOVED}]"
          git push
          echo "FF_PUSHED=1" >> "$GITHUB_ENV"

      - name: GitHub Pages پر نیا ورژن پبلش
        if: env.FF_PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null \
            && echo "✅ Pages پبلش شروع — 1-2 منٹ میں نیا ورژن لائیو" \
            || echo "ℹ️ Pages کا حکم نہیں گیا — فائلیں پھر بھی ریپو میں لگ گئی ہیں"
